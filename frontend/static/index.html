<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ReShare - Remote Vault & Streaming Engine</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;}
        .container { text-align: center; background: #2a2a2a; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 90%; max-width: 650px;}
        #register-section, #share-section, #watch-section, #vault-section { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 20px; }
        input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; width: 60%; font-size: 16px;}
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #ff4757; color: white; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; margin: 4px;}
        button:hover { background: #ff6b81; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        #log { background: #111; color: #0f0; font-family: monospace; padding: 12px; border-radius: 8px; height: 140px; overflow-y: scroll; text-align: left; font-size: 12px; margin-top: 10px;}
        video { width: 100%; max-width: 500px; border-radius: 8px; border: 2px solid #555; background: black;}
        #status-bar { height: 18px; background: #333; border-radius: 4px; margin-top: 10px; position: relative; overflow: hidden; }
        #status-progress { height: 100%; background: #2ecc71; width: 0%; transition: width 0.1s linear; }
        .file-list { text-align: left; background: #111; border-radius: 8px; padding: 10px; max-height: 150px; overflow-y: auto; margin-top: 10px;}
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid #333; font-size: 13px;}
    </style>
</head>
<body>

<div class="container">
    <h2>ReShare Vault Engine</h2>

    <!-- Step 1: Device Registration -->
    <div id="register-section">
        <p>Step 1: Enter your unique Device ID</p>
        <input type="text" id="device_id" placeholder="e.g., phone_a" value="phone_a">
        <button id="connect-btn" onclick="connectWebSocket()">Connect Hub</button>
    </div>

    <!-- Step 2: Sharing / Folder Access (Host Role) -->
    <div id="share-section" style="display: none;">
        <h3>📁 Host Vault Access</h3>
        <p>Target Device to Share With:</p>
        <input type="text" id="target_id" placeholder="e.g., phone_b" value="phone_b" style="margin-bottom: 10px;"><br/>
        
        <button class="btn-success" onclick="selectVaultDirectory()">📂 Grant Directory Permission</button>
        <button onclick="toggleKeepAlivePiP()">⚡ Background Keep-Alive (PiP)</button>
        
        <p id="vault-status" style="font-size: 12px; color: #aaa; margin-top: 5px;">Vault Status: Closed</p>
        
        <div id="status-bar"><div id="status-progress"></div></div>
        <p id="transfer-status" style="font-size: 12px; color: #aaa;">Status: Idle</p>
    </div>

    <!-- Step 3: Remote Vault Explorer (Guest Role) -->
    <div id="vault-section" style="display: none;">
        <h3>🌐 Remote Vault Explorer</h3>
        <p style="font-size: 12px; color: #aaa;">Available files on connected host:</p>
        <div id="file-tree" class="file-list">Waiting for host folder manifest...</div>
    </div>

    <!-- Step 4: Video Player -->
    <div id="watch-section" style="display: none;">
        <h3>🎬 Active Stream</h3>
        <video id="video-player" controls preload="metadata"></video>
        <br/>
        <button id="pip-btn" onclick="togglePictureInPicture()">📺 Toggle Player PiP</button>
    </div>

    <div id="log">ReShare Dev Logs Ready...</div>
</div>

<script>
    let socket;
    let localDeviceId;
    
    // File Access Handles (Host Side)
    let vaultDirectoryHandle = null;
    let vaultFileMap = new Map(); // Maps filename -> FileSystemFileHandle

    // Buffer management (Receiver Side)
    let rawChunksBuffer = [];
    let expectedTotalChunks = 0;
    let expectedFileSize = 0;
    let activeFileName = "Stream";

    // Invisible Keep-Alive PiP
    let keepAliveVideo = null;

    const logDiv = document.getElementById('log');
    const registerSection = document.getElementById('register-section');
    const shareSection = document.getElementById('share-section');
    const watchSection = document.getElementById('watch-section');
    const vaultSection = document.getElementById('vault-section');
    const progressBar = document.getElementById('status-progress');
    const statusText = document.getElementById('transfer-status');
    const videoPlayer = document.getElementById('video-player');
    const fileTreeDiv = document.getElementById('file-tree');

    function log(message) {
        logDiv.innerHTML += `> ${message}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(message);
    }

    // ==========================================
    // 1. DUMMY PIP BACKGROUND KEEP-ALIVE
    // ==========================================
    async function toggleKeepAlivePiP() {
        if (!document.pictureInPictureEnabled) {
            log("⚠️ [PiP] Picture-in-Picture not supported on this browser.");
            return;
        }

        try {
            if (!keepAliveVideo) {
                // Generate a silent 1x1 canvas stream
                const canvas = document.createElement('canvas');
                canvas.width = 16; canvas.height = 16;
                const ctx = canvas.getContext('2d');
                
                setInterval(() => {
                    ctx.fillStyle = ctx.fillStyle === '#000000' ? '#2ecc71' : '#000000';
                    ctx.fillRect(0, 0, 16, 16);
                }, 1000);

                const stream = canvas.captureStream(1);
                keepAliveVideo = document.createElement('video');
                keepAliveVideo.srcObject = stream;
                keepAliveVideo.muted = true;
                await keepAliveVideo.play();
            }

            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
                log("⚡ Keep-Alive PiP disabled.");
            } else {
                await keepAliveVideo.requestPictureInPicture();
                log("⚡ [BACKGROUND ACTIVE] Keep-Alive PiP triggered. JS thread will remain active!");
            }
        } catch (err) {
            log(`💥 [Keep-Alive Error] ${err.message}`);
        }
    }

    // ==========================================
    // 2. FILE SYSTEM ACCESS API (HOST VAULT)
    // ==========================================

    async function selectVaultDirectory() {
        // Modern File System Access API (Chrome, Edge, Opera)
        if ('showDirectoryPicker' in window) {
            try {
                vaultDirectoryHandle = await window.showDirectoryPicker();
                vaultFileMap.clear();
                
                const manifestList = [];

                for await (const entry of vaultDirectoryHandle.values()) {
                    if (entry.kind === 'file') {
                        const file = await entry.getFile();
                        if (file.type.startsWith('video/') || file.name.endsWith('.mp4') || file.name.endsWith('.mkv')) {
                            vaultFileMap.set(file.name, file); // Store file reference directly
                            manifestList.push({
                                name: file.name,
                                size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                                type: file.type
                            });
                        }
                    }
                }

                broadcastVaultManifest(manifestList);
                return;
            } catch (err) {
                if (err.name !== 'AbortError') {
                    log(`⚠️ Native picker failed, switching to standard folder picker: ${err.message}`);
                } else {
                    return; // User intentionally canceled selection
                }
            }
        }

        // Standard HTML5 Directory Fallback (Firefox, Safari, Mobile Chrome)
        log("📁 Using standard WebKit Directory Picker for Firefox/Safari compatibility...");
        
        const folderInput = document.createElement('input');
        folderInput.type = 'file';
        folderInput.webkitdirectory = true; // Enables directory selection in Firefox
        folderInput.multiple = true;

        folderInput.onchange = async (e) => {
            const files = Array.from(e.target.files);
            vaultFileMap.clear();
            const manifestList = [];

            files.forEach(file => {
                if (file.type.startsWith('video/') || file.name.endsWith('.mp4') || file.name.endsWith('.mkv')) {
                    // Extract relative path or simple name
                    const fileName = file.name;
                    vaultFileMap.set(fileName, file); // Direct File Blob object
                    manifestList.push({
                        name: fileName,
                        size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                        type: file.type
                    });
                }
            });

            broadcastVaultManifest(manifestList);
        };

        folderInput.click();
    }

    function broadcastVaultManifest(manifestList) {
        document.getElementById('vault-status').innerText = `Vault Open: ${manifestList.length} videos indexed.`;
        log(`📂 [HOST VAULT] Indexed ${manifestList.length} files in selected folder.`);

        const targetId = document.getElementById('target_id').value.toLowerCase().trim();
        if (targetId) {
            socket.send(JSON.stringify({
                type: "vault_manifest",
                from: localDeviceId,
                target_id: targetId,
                files: manifestList
            }));
            log(`📤 Manifest broadcast sent to '${targetId}'.`);
        }
    }


    // Stream a requested file handle over WebSocket (Host side)


    async function streamFileFromVault(filename, targetId) {
        let file = vaultFileMap.get(filename);
        
        // Handle both FileSystemFileHandle and direct File objects
        if (file && typeof file.getFile === 'function') {
            file = await file.getFile();
        }

        if (!file) {
            log(`❌ [HOST] Requested file '${filename}' not found in local vault map.`);
            return;
        }

        log(`🚀 [HOST STREAMING] Slicing and sending '${file.name}' (${(file.size / 1024 / 1024).toFixed(2)} MB)...`);

        const CHUNK_SIZE = 2 * 1024 * 1024;
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

        socket.send(JSON.stringify({
            type: "metadata",
            from: localDeviceId,
            target_id: targetId,
            filename: file.name,
            file_size: file.size,
            total_chunks: totalChunks
        }));

        let currentChunkIndex = 0;

        async function sendNextChunk() {
            if (currentChunkIndex >= totalChunks) {
                log(`✅ [HOST] Completed sending all ${totalChunks} binary slices.`);
                socket.send(JSON.stringify({
                    type: "stream_complete",
                    from: localDeviceId,
                    target_id: targetId
                }));
                return;
            }

            const startByte = currentChunkIndex * CHUNK_SIZE;
            const endByte = Math.min(startByte + CHUNK_SIZE, file.size);
            const blobSlice = file.slice(startByte, endByte);
            const arrayBuffer = await blobSlice.arrayBuffer();

            socket.send(arrayBuffer);

            const percent = Math.round(((currentChunkIndex + 1) / totalChunks) * 100);
            if (percent % 10 === 0 || currentChunkIndex + 1 === totalChunks) {
                progressBar.style.width = percent + '%';
                statusText.innerText = `Host Streaming: ${percent}%`;
            }

            currentChunkIndex++;
            setTimeout(sendNextChunk, 30);
        }

        sendNextChunk();
    }
    // ==========================================
    // 3. WEBSOCKET SIGNALING & GUEST RECEIVER
    // ==========================================
    function connectWebSocket() {
        localDeviceId = document.getElementById('device_id').value.trim();
        if (!localDeviceId) { alert("Enter a device name."); return; }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/${localDeviceId}`);
        socket.binaryType = 'arraybuffer';

        socket.onopen = function() {
            log(`✅ Connected as '${localDeviceId}'.`);
            registerSection.style.display = 'none';
            shareSection.style.display = 'block';
            vaultSection.style.display = 'block';
            watchSection.style.display = 'block';
        };

        socket.onmessage = function(event) {
            // 1. BINARY CHUNK RECEIVED
            if (event.data instanceof ArrayBuffer) {
                rawChunksBuffer.push(event.data);
                
                if (expectedTotalChunks > 0) {
                    const percent = Math.round((rawChunksBuffer.length / expectedTotalChunks) * 100);
                    if (percent % 10 === 0 || rawChunksBuffer.length === expectedTotalChunks) {
                        progressBar.style.width = percent + '%';
                        statusText.innerText = `Receiving Stream: ${percent}%`;
                    }
                }

                if (expectedTotalChunks > 0 && rawChunksBuffer.length === expectedTotalChunks) {
                    log("🏁 Final chunk reached!");
                    assembleAndPlay();
                }
            } 
            // 2. TEXT CONTROL PACKET
            else {
                try {
                    const packet = JSON.parse(event.data);

                    // Vault Manifest Packet (Guest side receives folder tree from host)
                    if (packet.type === 'vault_manifest') {
                        log(`📁 [GUEST] Received remote folder catalog from '${packet.from}' (${packet.files.length} items).`);
                        renderVaultFiles(packet.files, packet.from);
                    }
                    // Remote File Request Packet (Host side receives request to start sending a file)
                    else if (packet.type === 'request_file') {
                        log(`📩 [HOST] Device '${packet.from}' requested file: '${packet.filename}'`);
                        streamFileFromVault(packet.filename, packet.from);
                    }
                    // Stream Metadata Packet
                    else if (packet.type === 'metadata') {
                        log(`📁 Stream Starting: '${packet.filename}' (${(packet.file_size / 1024 / 1024).toFixed(2)} MB)`);
                        rawChunksBuffer = [];
                        expectedTotalChunks = packet.total_chunks;
                        expectedFileSize = packet.file_size;
                        activeFileName = packet.filename;
                        progressBar.style.width = '0%';
                        statusText.innerText = "Receiving stream metadata...";
                    }
                    // Stream Complete Packet
                    else if (packet.type === 'stream_complete') {
                        log(`🏁 Stream complete signal received.`);
                        progressBar.style.width = '100%';
                        statusText.innerText = "Status: Transfer Finished.";
                        assembleAndPlay();
                    }
                } catch (err) {
                    log(`Hub msg: ${event.data}`);
                }
            }
        };

        socket.onclose = () => log("❌ Disconnected from WebSocket.");
        socket.onerror = (err) => log(`💥 Socket Error: ${err.message}`);
    }

    // Render remote vault items for the guest
    function renderVaultFiles(files, hostDeviceId) {
        fileTreeDiv.innerHTML = "";
        if (files.length === 0) {
            fileTreeDiv.innerHTML = "No videos found in host folder.";
            return;
        }

        files.forEach(f => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <span>🎬 <strong>${f.name}</strong> <small style="color:#aaa;">(${f.size})</small></span>
                <button class="btn-success" onclick="requestRemoteFile('${f.name}', '${hostDeviceId}')">Play Stream</button>
            `;
            fileTreeDiv.appendChild(item);
        });
    }

    // Send a request to the host to start streaming a specific file
    function requestRemoteFile(filename, hostDeviceId) {
        log(`📡 Requesting '${filename}' from host '${hostDeviceId}'...`);
        socket.send(JSON.stringify({
            type: "request_file",
            from: localDeviceId,
            target_id: hostDeviceId,
            filename: filename
        }));
    }

    // ==========================================
    // 4. ASSEMBLY & PLAYBACK
    // ==========================================
    function assembleAndPlay() {
        if (rawChunksBuffer.length === 0) return;

        try {
            const videoBlob = new Blob(rawChunksBuffer, { type: 'video/mp4' });
            const objectUrl = URL.createObjectURL(videoBlob);

            videoPlayer.pause();
            videoPlayer.src = objectUrl;
            videoPlayer.load();

            videoPlayer.play().then(() => {
                log("▶️ Video playing successfully!");
            }).catch(() => {
                log("⚠️ Press manual play on video controls.");
            });
        } catch (err) {
            log(`💥 [ASSEMBLY CRASH] ${err.message}`);
        }
    }

    async function togglePictureInPicture() {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        } else if (videoPlayer.src) {
            await videoPlayer.requestPictureInPicture();
        }
    }
</script>

</body>
</html>

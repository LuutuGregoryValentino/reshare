<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ReShare - Media Debug Engine</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #2a2a2a; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 80%; max-width: 600px;}
        #register-section, #share-section, #watch-section { margin-bottom: 25px; border-bottom: 1px solid #444; padding-bottom: 20px; }
        input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; width: 60%; font-size: 16px;}
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #ff4757; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.2s;}
        button:hover { background: #ff6b81; }
        button:disabled { background: #555; cursor: not-allowed; }
        #log { background: #111; color: #0f0; font-family: monospace; padding: 15px; border-radius: 8px; height: 180px; overflow-y: scroll; text-align: left; font-size: 12px; margin-top: 10px;}
        video { width: 100%; max-width: 500px; border-radius: 8px; border: 2px solid #555; background: black;}
        #status-bar { height: 20px; background: #333; border-radius: 4px; margin-top: 10px; position: relative; overflow: hidden; }
        #status-progress { height: 100%; background: #2ecc71; width: 0%; transition: width 0.1s linear; }
    </style>
</head>
<body>

<div class="container">
    <h2>ReShare Dev Hub (Diagnostic Mode)</h2>

    <div id="register-section">
        <p>Step 1: Enter your unique Device ID</p>
        <input type="text" id="device_id" placeholder="e.g., phone_a" value="phone_a">
        <button id="connect-btn" onclick="connectWebSocket()">Connect Hub</button>
    </div>

    <div id="share-section" style="display: none;">
        <h3>📤 Share a Movie</h3>
        <p>Address of target device:</p>
        <input type="text" id="target_id" placeholder="e.g., phone_b" value="phone_b" style="margin-bottom: 10px;"><br/>
        
        <input type="file" id="file-picker" accept="video/mp4" style="color: transparent; margin-bottom: 10px;">
        <br/>
        <button id="share-btn" onclick="startRealFileStream()" disabled>Start Real Stream</button>
        
        <div id="status-bar"><div id="status-progress"></div></div>
        <p id="transfer-status" style="font-size: 12px; color: #aaa;">Status: Idle</p>
    </div>

    <div id="watch-section" style="display: none;">
        <h3>🎬 Watching Div</h3>
        <video id="video-player" controls preload="metadata">
            Your browser does not support the video tag.
        </video>
        <p style="font-size: 12px; color: #aaa;">Waiting for movie stream...</p>
    </div>

    <div id="log">ReShare Dev Logs Ready...</div>
</div>

<script>
    let socket;
    let localDeviceId;
    let fileToBeSent = null;

    let rawChunksBuffer = [];
    let expectedTotalChunks = 0;
    let expectedFileSize = 0;

    const logDiv = document.getElementById('log');
    const shareSection = document.getElementById('share-section');
    const watchSection = document.getElementById('watch-section');
    const registerSection = document.getElementById('register-section');
    const filePicker = document.getElementById('file-picker');
    const shareBtn = document.getElementById('share-btn');
    const progressBar = document.getElementById('status-progress');
    const statusText = document.getElementById('transfer-status');
    const videoPlayer = document.getElementById('video-player');

    function log(message) {
        logDiv.innerHTML += `> ${message}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(message);
    }

    // Attach deep diagnostic events directly to the HTML5 video player
    videoPlayer.addEventListener('error', (e) => {
        const err = videoPlayer.error;
        let details = "Unknown";
        if (err) {
            switch(err.code) {
                case 1: details = "MEDIA_ERR_ABORTED (Fetching aborted)"; break;
                case 2: details = "MEDIA_ERR_NETWORK (Network fail)"; break;
                case 3: details = "MEDIA_ERR_DECODE (Corrupt file or unsupported codec)"; break;
                case 4: details = "MEDIA_ERR_SRC_NOT_SUPPORTED (Format/MIME not supported)"; break;
            }
        }
        log(`💥 [VIDEO ERROR ${err ? err.code : '?'}] ${details}`);
    });

    videoPlayer.addEventListener('loadedmetadata', () => {
        log(`🎯 [PLAYER] Metadata Loaded! Duration: ${videoPlayer.duration.toFixed(2)}s, Dimensions: ${videoPlayer.videoWidth}x${videoPlayer.videoHeight}`);
    });

    videoPlayer.addEventListener('canplay', () => {
        log(`✅ [PLAYER] Video ready for playback!`);
    });

    function assembleAndPlay() {
        log("---------------------------------------");
        log("🔍 [DIAGNOSTIC] Beginning Assembly Process...");

        if (rawChunksBuffer.length === 0) {
            log("❌ [DIAGNOSTIC FAULT] Buffer is completely empty!");
            return;
        }

        // Calculate total buffer bytes
        let actualBytes = 0;
        for (let chunk of rawChunksBuffer) {
            actualBytes += chunk.byteLength;
        }

        log(`📊 Chunks Collected: ${rawChunksBuffer.length} / ${expectedTotalChunks}`);
        log(`📊 Total Bytes in Memory: ${actualBytes} bytes (Expected: ${expectedFileSize} bytes)`);

        if (expectedFileSize > 0 && actualBytes !== expectedFileSize) {
            log(`⚠️ [WARNING] Size Mismatch! Missing ${expectedFileSize - actualBytes} bytes.`);
        }

        // Create Blob
        try {
            const videoBlob = new Blob(rawChunksBuffer, { type: 'video/mp4' });
            log(`📦 Blob Created successfully! Type: '${videoBlob.type}', Size: ${videoBlob.size} bytes`);

            const objectUrl = URL.createObjectURL(videoBlob);
            log(`🔗 Generated Blob URL: ${objectUrl}`);

            // Test if browser claims it can play this format
            const canPlay = videoPlayer.canPlayType('video/mp4');
            log(`❓ Browser 'video/mp4' support rating: '${canPlay}'`);

            // Load into player cleanly
            videoPlayer.pause();
            videoPlayer.src = objectUrl;
            videoPlayer.load();

            log("⏳ Triggered videoPlayer.load(). Awaiting loadedmetadata event...");

            // Play attempt
            const playPromise = videoPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    log("▶️ [SUCCESS] Video actively playing!");
                }).catch(err => {
                    log(`⚠️ [AUTOPLAY BLOCKED] ${err.name}: ${err.message}`);
                    log("👉 Action: Click the manual Play button on the video player interface.");
                });
            }
        } catch (err) {
            log(`💥 [ASSEMBLY CRASH] ${err.stack || err.message}`);
        }
    }

    function connectWebSocket() {
        localDeviceId = document.getElementById('device_id').value.trim();
        if (!localDeviceId) { alert("Please enter a device name."); return; }

        log(`Connecting to Hub as '${localDeviceId}'...`);
        socket = new WebSocket(`ws://${window.location.host}/ws/${localDeviceId}`);
        socket.binaryType = 'arraybuffer';

        socket.onopen = function() {
            log(`✅ WebSocket Connected as '${localDeviceId}'.`);
            registerSection.style.display = 'none';
            shareSection.style.display = 'block';
            watchSection.style.display = 'block';
        };

        socket.onmessage = function(event) {
            // 1. RAW BINARY CHUNK
            if (event.data instanceof ArrayBuffer) {
                rawChunksBuffer.push(event.data);
                log(`📦 [DATA] Received chunk ${rawChunksBuffer.length}/${expectedTotalChunks || '?'}`);
                
                if (expectedTotalChunks > 0) {
                    const percent = Math.round((rawChunksBuffer.length / expectedTotalChunks) * 100);
                    progressBar.style.width = percent + '%';
                    statusText.innerText = `Receiving Stream: ${percent}%`;
                }

                // Fallback: If 100% of chunks arrive, auto-assemble even if stream_complete packet dropped
                if (expectedTotalChunks > 0 && rawChunksBuffer.length === expectedTotalChunks) {
                    log("🏁 Final chunk reached via count threshold!");
                    assembleAndPlay();
                }
            } 
            // 2. CONTROL SIGNAL
            else {
                try {
                    const packet = JSON.parse(event.data);
                    
                    if (packet.type === 'metadata') {
                        log(`📁 [META] File: '${packet.filename}' (${packet.file_size} bytes, ${packet.total_chunks} chunks).`);
                        rawChunksBuffer = [];
                        expectedTotalChunks = packet.total_chunks;
                        expectedFileSize = packet.file_size;
                        progressBar.style.width = '0%';
                        statusText.innerText = "Receiving stream metadata...";
                    } 
                    else if (packet.type === 'stream_complete') {
                        log(`🏁 Stream complete signal received from sender.`);
                        progressBar.style.width = '100%';
                        statusText.innerText = "Status: Transfer Finished.";
                        assembleAndPlay();
                    }
                } catch (err) {
                    log(`Hub text: ${event.data}`);
                }
            }
        };

        socket.onclose = function() {
            log(`❌ WebSocket Disconnected.`);
            registerSection.style.display = 'block';
            shareSection.style.display = 'none';
            watchSection.style.display = 'none';
        };

        socket.onerror = function(error) {
            log(`💥 WebSocket Error: ${error.message}`);
        };
    }

    filePicker.addEventListener('change', function(event) {
        if (event.target.files.length > 0) {
            fileToBeSent = event.target.files[0];
            const fileSizeMB = (fileToBeSent.size / (1024 * 1024)).toFixed(2);
            log(`✅ File selected: '${fileToBeSent.name}' (${fileSizeMB} MB)`);
            shareBtn.disabled = false;
        } else {
            fileToBeSent = null;
            shareBtn.disabled = true;
        }
    });

    function startRealFileStream() {
        const targetId = document.getElementById('target_id').value.toLowerCase().trim();
        if (!fileToBeSent || !targetId) { alert("Please target a valid device and file."); return; }

        log(`🚀 Starting transfer of '${fileToBeSent.name}' to '${targetId}'...`);
        shareBtn.disabled = true;

        const CHUNK_SIZE = 2 * 1024 * 1024;
        const fileSize = fileToBeSent.size;
        const totalChunks = Math.ceil(fileSize / CHUNK_SIZE);

        const metadataPacket = {
            type: "metadata",
            from: localDeviceId,
            target_id: targetId,
            filename: fileToBeSent.name,
            file_size: fileSize,
            total_chunks: totalChunks
        };
        socket.send(JSON.stringify(metadataPacket));

        let currentChunkIndex = 0;

        function readAndSendChunk() {
            if (currentChunkIndex >= totalChunks) {
                log(`✅ Sent all ${totalChunks} binary slices.`);
                
                const completePacket = {
                    type: "stream_complete",
                    from: localDeviceId,
                    target_id: targetId
                };
                socket.send(JSON.stringify(completePacket));

                shareBtn.disabled = false;
                progressBar.style.width = '100%';
                statusText.innerText = "Status: Completed.";
                return;
            }

            const startByte = currentChunkIndex * CHUNK_SIZE;
            const endByte = Math.min(startByte + CHUNK_SIZE, fileSize);
            const blobSlice = fileToBeSent.slice(startByte, endByte);

            const reader = new FileReader();
            reader.onload = function(e) {
                if (e.target.readyState === FileReader.DONE) {
                    socket.send(e.target.result);
                    
                    const percent = Math.round(((currentChunkIndex + 1) / totalChunks) * 100);
                    progressBar.style.width = percent + '%';
                    statusText.innerText = `Status: Sending Chunk ${currentChunkIndex + 1}/${totalChunks}...`;

                    currentChunkIndex++;
                    setTimeout(readAndSendChunk, 100);
                }
            };

            reader.readAsArrayBuffer(blobSlice);
        }

        readAndSendChunk();
    }
</script>

</body>
</html>

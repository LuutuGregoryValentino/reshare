<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReShare</title>
</head>
<body style="background: #222; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h1>ReShare</h1>
    <div id="status" style="font-size: 24px; color: yellow;">Connecting...</div>

    <script>
        const name = prompt("Enter your devices alias to be used whiel sharing data", "phone_a")
        const currentHost = window.location.host;
        const socket = new WebSocket(`ws://${currentHost}/ws/${name}`);

        socket.onopen = () =>{
            document.getElementById("status").innerText = "Connected to Hub";
            document.getElementById("status").style.color = "lightgreen"
        };


        socket.onmessage = (event) => {
        try{
            const packet  = JSON.parse(event.data);

        if (packet.type === 'metadata') {
            console.log(`📁 [METADATA RECEIVED] Incoming file: ${packet.filename} (${packet.file_size} MB)`);
            alert(`Device incoming file! Name: ${packet.filename}`);
        } 
        else if (packet.type === 'file_chunk') {
            console.log(`📦 [CHUNK RECEIVED] ${packet.filename} -> Chunk ${packet.chunk_index + 1}/${packet.total_chunks}`);
        } 
        else if (packet.type === 'chat') {
            console.log(`💬 [CHAT RECEIVED] ${packet.message}`);
        }

        } catch (e){
            console.log("Hub text: ", event.data)
        }
            console.log("Message from server:", event.data);
            alert("Server says: " + event.data);
        };
        </script>
</body>
</html>
